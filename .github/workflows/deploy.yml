name: Build & Deploy

# Build the image on GitHub's runners (so the lightweight VM doesn't have to),
# push it to GHCR, then have the VM's self-hosted runner pull and run it.
# Mirrors Island GO's pipeline; the two containers share the VM.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nassaunights
  cancel-in-progress: false

env:
  # GHCR image name must be lowercase.
  IMAGE_NAME: ghcr.io/limni/bahamas-nightlife

jobs:
  # --- Heavy lifting on a GitHub-hosted runner -------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Vite inlines these at build time, so they come from repo secrets.
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_MAP_TILE_URL=${{ vars.VITE_MAP_TILE_URL }}
            VITE_MAP_ATTRIBUTION=${{ vars.VITE_MAP_ATTRIBUTION }}
            SITE_URL=${{ vars.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Pull & run on the VM (cheap: no build) --------------------------------
  deploy:
    needs: build
    # Self-hosted runners are registered per repo — this one must be registered
    # to bahamas-nightlife (Island GO's runner only serves bahamas-exp).
    runs-on: self-hosted
    permissions:
      packages: read
    env:
      NAME: nassaunights
      PORT: ${{ vars.PORT || '5110' }}
      # Job-private Docker config, so the short-lived GHCR token never lands in
      # the runner user's ~/.docker/config.json.
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-config
    steps:
      # Plain CLI login instead of docker/login-action: on this VM the action
      # spent ~12 minutes per deploy (Node start-up plus its login/logout),
      # while the docker commands below take seconds.
      - name: Pull & run
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          IMAGE="$IMAGE_NAME:${{ github.sha }}"
          docker pull "$IMAGE"
          docker rm -f "$NAME" 2>/dev/null || true
          # Loopback only — the host nginx vhost is the public entry point.
          docker run -d --name "$NAME" --restart unless-stopped -p "127.0.0.1:$PORT:80" "$IMAGE"
          # Reclaim disk on the small VM: drop unused images older than a day.
          # (Only removes images no container uses, so Island GO's is safe.)
          docker image prune -af --filter "until=24h"
