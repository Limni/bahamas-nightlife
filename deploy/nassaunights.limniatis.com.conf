# Host nginx reverse proxy for nassaunights.limniatis.com -> Nassau Nights container.
#
# Runs on the same VM as Island GO (islandgo.limniatis.com), so it must not
# clash with it:
#   * upstream name   nassaunights_app       (islandgo uses islandgo_app)
#   * host port       127.0.0.1:5070       (islandgo uses 5050)
#   * log files       nassaunights.*.log     (islandgo uses islandgo.*.log)
#   * $connection_upgrade is NOT defined here — it already comes from
#     /etc/nginx/conf.d/islandgo-upgrade-map.conf (installed for Island GO).
#     Defining that map a second time makes `nginx -t` fail.
#
# The admin console is the /admin path on this same host, so unlike Island GO
# there is no separate admin-* vhost.
#
# Install on the host (NOT inside the container) with:
#   sudo ./deploy/enable-https.sh
# which does the steps below plus the :443 certificate snippet. By hand:
#   sudo cp deploy/nassaunights.limniatis.com.conf /etc/nginx/sites-available/nassaunights.limniatis.com.conf
#   sudo ln -s /etc/nginx/sites-available/nassaunights.limniatis.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS (Cloudflare): add `nassaunights` — A/AAAA to this host, or CNAME to
# islandgo.limniatis.com — Proxied (orange). nassaunights.limniatis.com is a
# first-level subdomain, so Cloudflare's free *.limniatis.com Universal SSL
# covers it at the edge.
#
# Origin TLS: match whatever islandgo.limniatis.com does (Cloudflare dashboard
# -> SSL/TLS mode):
#   * Flexible             -> this HTTP block is enough as-is.
#   * Full / Full (strict) -> also needs :443. Either
#       sudo certbot --nginx -d nassaunights.limniatis.com
#     (certbot adds the :443 block + redirect to this file), or, if islandgo
#     uses a Cloudflare Origin CA cert for *.limniatis.com, copy its
#     ssl_certificate / ssl_certificate_key lines into a :443 block here.

upstream nassaunights_app {
    server 127.0.0.1:5070;
    keepalive 16;
}

server {
    listen      80;
    listen      [::]:80;
    server_name nassaunights.limniatis.com;

    # Allow Let's Encrypt HTTP-01 challenges before TLS is set up.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Photo uploads go browser -> Supabase directly, not through here; this
    # just keeps headroom for anything that does pass through.
    client_max_body_size 25m;

    access_log /var/log/nginx/nassaunights.access.log;
    error_log  /var/log/nginx/nassaunights.error.log;

    location / {
        proxy_pass         http://nassaunights_app;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# HTTPS. Cloudflare's SSL/TLS mode is Full, so it connects to this origin on
# :443. Without this block nginx answers nassaunights on :443 with its default
# TLS server, which is Island GO.
#
# The certificate lines live in a snippet that deploy/enable-https.sh copies
# from Island GO's live vhost (certbot or Cloudflare Origin CA, whichever it
# uses). Run that script rather than copying this file by hand.
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name nassaunights.limniatis.com;

    include /etc/nginx/snippets/nassaunights-ssl.conf;

    client_max_body_size 25m;

    access_log /var/log/nginx/nassaunights.access.log;
    error_log  /var/log/nginx/nassaunights.error.log;

    location / {
        proxy_pass         http://nassaunights_app;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
