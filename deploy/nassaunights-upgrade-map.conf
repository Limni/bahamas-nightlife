# ONLY needed if this server does NOT already have Island GO's
# /etc/nginx/conf.d/islandgo-upgrade-map.conf (or another definition of
# $connection_upgrade). Check first:
#   grep -rn 'connection_upgrade' /etc/nginx/
# If a `map $http_upgrade $connection_upgrade` already exists, SKIP this file —
# defining it twice is an error. Otherwise install it into the http{} context:
#   sudo cp deploy/nassaunights-upgrade-map.conf /etc/nginx/conf.d/nassaunights-upgrade-map.conf
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
