server {
    listen 80;
    server_name www.nassaunights.com;
    # The host proxy forwards Host, so this ships with the app without DNS or TLS changes.
    return 301 https://nassaunights.com$request_uri;
}

server {
    listen       80 default_server;
    server_name  _;
    root   /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/xml text/xml application/wasm;
    gzip_min_length 1024;

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker must never be cached, or updates to it get stuck.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Regenerated on every build; let crawlers re-read them.
    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Prefer each public route's canonical HTML. Keep the untagged shell for
    # account/admin routes and pages published since the last build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri/index.html $uri /spa.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /spa.html {
        add_header Cache-Control "no-cache";
    }
}
